plugins {
    id 'com.android.application' version '8.9.2'
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.6.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.6.1'
    testImplementation 'junit:junit:4.13.2'
}

android {
    namespace 'app.voyahradio'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    flavorDimensions 'vehicle'
    productFlavors {
        voyah {
            dimension 'vehicle'
            buildConfigField 'boolean', 'MAZDA_EZ6', 'false'
        }
        mazdaEz6 {
            dimension 'vehicle'
            applicationId 'app.mazdaez6radio'
            buildConfigField 'boolean', 'MAZDA_EZ6', 'true'
            buildConfigField 'String', 'RELEASE_ASSET', '"MazdaEZ6Radio"'
        }
    }

    defaultConfig {
        applicationId 'app.voyahradio'
        buildConfigField 'String', 'RELEASE_ASSET', '"VoyahRadio"'
        minSdk 28
        targetSdk 34
        versionCode 13
        versionName '0.3.10'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    if (providers.environmentVariable('VOYAH_RADIO_KEYSTORE').isPresent()) {
        signingConfigs {
            localRelease {
                storeFile file(providers.environmentVariable('VOYAH_RADIO_KEYSTORE').get())
                storePassword providers.environmentVariable('VOYAH_RADIO_STORE_PASSWORD').get()
                keyAlias 'voyah-radio'
                keyPassword storePassword
            }
        }

        buildTypes {
            release {
                signingConfig signingConfigs.localRelease
            }
        }
    }
}
